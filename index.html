<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Season Cup Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at 15% 0%, rgba(56, 189, 248, 0.14), transparent 45%),
                radial-gradient(circle at 85% 100%, rgba(251, 191, 36, 0.08), transparent 40%),
                linear-gradient(160deg, #050810 0%, #0b1526 45%, #10233a 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #e8f1fb;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: #f4f9ff;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        .header p {
            font-size: 1.1rem;
            color: #94a8c2;
        }

        .season-badge {
            display: inline-block;
            margin-top: 14px;
            padding: 6px 18px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.08);
            color: #7dd3fc;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .countdown {
            margin-top: 15px;
            padding: 10px 22px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            display: inline-block;
            font-size: 1.05rem;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .nav-links {
            text-align: center;
            margin-bottom: 30px;
        }

        .nav-links a {
            display: inline-block;
            padding: 12px 24px;
            margin: 0 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cfe4fa;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .nav-links a:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }

        .nav-links a.active {
            background: linear-gradient(135deg, #22d3ee, #38bdf8);
            color: #06202f;
            border-color: transparent;
            box-shadow: 0 6px 18px rgba(56, 189, 248, 0.35);
        }

        .clinch-status {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 20px 30px;
            text-align: center;
            margin-bottom: 30px;
            backdrop-filter: blur(12px);
            color: #e8f1fb;
        }

        .clinch-status.clinched {
            background: rgba(251, 191, 36, 0.1);
            border-color: rgba(251, 191, 36, 0.45);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.2);
        }

        .clinch-status h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #7dd3fc;
        }

        .clinch-status.clinched h3 {
            color: #fbbf24;
        }

        .clinch-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #7dd3fc;
        }

        .clinch-status.clinched .clinch-number {
            color: #fbbf24;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
        }

        .clinch-details {
            font-size: 0.95rem;
            margin-top: 10px;
            color: #b8c9dc;
        }

        .current-holder {
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .current-holder h2 {
            font-size: 1.6rem;
            margin-bottom: 15px;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .current-holder .team {
            font-size: 2.8rem;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
        }

        .next-game {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            margin-bottom: 40px;
            backdrop-filter: blur(12px);
            color: #e8f1fb;
        }

        .next-game h3 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: #7dd3fc;
        }

        .game-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .game-detail {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px;
            border-radius: 10px;
        }

        .game-detail-label {
            font-size: 0.85rem;
            color: #8ba2ba;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .game-detail-value {
            font-size: 1.25rem;
            font-weight: bold;
            color: #f4f9ff;
        }

        .vs-matchup {
            font-size: 1.7rem;
            font-weight: bold;
            margin: 15px 0;
            color: #f4f9ff;
        }

        .no-game {
            font-style: italic;
            color: #8ba2ba;
            font-size: 1.05rem;
        }

        .leaderboard {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(12px);
        }

        .leaderboard h3 {
            font-size: 1.7rem;
            margin-bottom: 25px;
            color: #f4f9ff;
            text-align: center;
        }

        .player-row {
            display: flex;
            align-items: center;
            padding: 20px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border-left: 4px solid #38bdf8;
            transition: all 0.25s ease;
        }

        .player-row:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .player-row:nth-child(1) {
            border-left-color: #fbbf24;
        }

        .player-row:nth-child(2) {
            border-left-color: #cbd5e1;
        }

        .player-row:nth-child(3) {
            border-left-color: #d97757;
        }

        .player-rank {
            font-size: 1.4rem;
            font-weight: bold;
            color: #7dd3fc;
            margin-right: 20px;
            min-width: 40px;
        }

        .player-info {
            flex-grow: 1;
        }

        .player-name {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #f4f9ff;
        }

        .player-teams {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .team-tag {
            background: #38bdf8;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .team-tag.has-cup {
            animation: pulse 2s infinite;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }

            100% {
                transform: scale(1);
            }
        }

        .player-stats {
            text-align: right;
        }

        .cup-days {
            font-size: 2rem;
            font-weight: bold;
            color: #fbbf24;
        }

        .cup-days-label {
            font-size: 0.85rem;
            color: #8ba2ba;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #cfe4fa;
            font-size: 1.2rem;
        }

        .error {
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: #fecaca;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .last-updated {
            text-align: center;
            color: #7f9bc0;
            font-size: 0.85rem;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .player-row {
                flex-direction: column;
                text-align: center;
            }

            .player-stats {
                text-align: center;
                margin-top: 15px;
            }

            .nav-links a {
                display: block;
                margin: 10px 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>🏆 In-Season Cup Tracker</h1>
            <p>Track which teams are dominating the in-season cup competition</p>
            <div class="season-badge">2026–27 Season</div>
            <div id="countdown" class="countdown"></div>
        </header>

        <div class="nav-links">
            <a href="index.html" class="active">🏆 Leaderboard</a>
            <a href="stats.html">📊 Statistics</a>
        </div>

        <div id="loading" class="loading" style="display: none;">
            Loading cup data...
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="currentHolder" class="current-holder" style="display: none;">
            <h2>Current Cup Holder</h2>
            <div class="team" id="currentTeam"></div>
            <div id="currentPlayer"></div>
        </div>

        <div id="nextGame" class="next-game" style="display: none;">
            <h3>Next Cup Holder Game</h3>
            <div id="nextGameContent"></div>
        </div>

        <div id="clinchStatus" class="clinch-status" style="display: none;">
            <h3>🏅 Race to the Cup</h3>
            <div id="clinchContent"></div>
        </div>

        <div id="leaderboard" class="leaderboard" style="display: none;">
            <h3>Player Leaderboard</h3>
            <div id="playerList"></div>
        </div>

        <div class="last-updated" id="lastUpdated"></div>
    </div>

    <script>

        // Configuration - update these URLs to match your Fastly service
        const API_BASE_URL = "https://in-season-cup.edgecompute.app"; // Assumes same domain

        // Calculate days left in regular season
        function getDaysLeftInSeason() {
            const endOfSeason = new Date('2027-04-10T23:59:59');
            const now = new Date();
            const timeDiff = endOfSeason - now;
            return Math.ceil(timeDiff / (1000 * 60 * 60 * 24));
        }

        // Calculate and display days until end of regular season
        function updateCountdown() {
            const daysLeft = getDaysLeftInSeason();

            const countdownDiv = document.getElementById('countdown');
            if (daysLeft > 0) {
                countdownDiv.textContent = `📅 ${daysLeft} day${daysLeft !== 1 ? 's' : ''} left in regular season`;
            } else if (daysLeft === 0) {
                countdownDiv.textContent = '📅 Last day of regular season!';
            } else {
                countdownDiv.textContent = '📅 Regular season has ended';
            }
        }

        // Update countdown on page load
        updateCountdown();

        let playersData = [];
        let cupHistory = {};
        let currentOwner = '';

        // Team colors lookup
        const teamColors = {
            "ANA": { "name": "Anaheim Ducks", "colors": { "primary": "#010101", "secondary": "#a2aaad", "accent": "#fc4c02" } },
            "ARI": { "name": "Arizona Coyotes", "colors": { "primary": "#010101", "secondary": "#862633", "accent": "#ddcba4" } },
            "BOS": { "name": "Boston Bruins", "colors": { "primary": "#010101", "secondary": "#ffb81c", "accent": "#ffb81c" } },
            "BUF": { "name": "Buffalo Sabres", "colors": { "primary": "#041e42", "secondary": "#ffb81c", "accent": "#c8102e" } },
            "CGY": { "name": "Calgary Flames", "colors": { "primary": "#c8102e", "secondary": "#f1be48", "accent": "#010101" } },
            "CAR": { "name": "Carolina Hurricanes", "colors": { "primary": "#c8102e", "secondary": "#010101", "accent": "#a2aaad" } },
            "CHI": { "name": "Chicago Blackhawks", "colors": { "primary": "#c8102e", "secondary": "#010101", "accent": "#ffd100" } },
            "COL": { "name": "Colorado Avalanche", "colors": { "primary": "#6f263d", "secondary": "#236192", "accent": "#a4a9ad" } },
            "CBJ": { "name": "Columbus Blue Jackets", "colors": { "primary": "#041e42", "secondary": "#c8102e", "accent": "#a4a9ad" } },
            "DAL": { "name": "Dallas Stars", "colors": { "primary": "#006341", "secondary": "#010101", "accent": "#8a8d8f" } },
            "DET": { "name": "Detroit Red Wings", "colors": { "primary": "#c8102e", "secondary": "#ffffff", "accent": "#000000" } },
            "EDM": { "name": "Edmonton Oilers", "colors": { "primary": "#00205b", "secondary": "#cf4520", "accent": "#ffffff" } },
            "FLA": { "name": "Florida Panthers", "colors": { "primary": "#041e42", "secondary": "#c8102e", "accent": "#b9975b" } },
            "LAK": { "name": "Los Angeles Kings", "colors": { "primary": "#010101", "secondary": "#a2aaad", "accent": "#ffffff" } },
            "MIN": { "name": "Minnesota Wild", "colors": { "primary": "#154734", "secondary": "#a6192e", "accent": "#eaaa00" } },
            "MTL": { "name": "Montreal Canadiens", "colors": { "primary": "#a6192e", "secondary": "#001e62", "accent": "#ffffff" } },
            "NSH": { "name": "Nashville Predators", "colors": { "primary": "#ffb81c", "secondary": "#041e42", "accent": "#ffffff" } },
            "NJD": { "name": "New Jersey Devils", "colors": { "primary": "#c8102e", "secondary": "#010101", "accent": "#ffffff" } },
            "NYI": { "name": "New York Islanders", "colors": { "primary": "#003087", "secondary": "#fc4c02", "accent": "#ffffff" } },
            "NYR": { "name": "New York Rangers", "colors": { "primary": "#0033a0", "secondary": "#c8102e", "accent": "#ffffff" } },
            "OTT": { "name": "Ottawa Senators", "colors": { "primary": "#c8102e", "secondary": "#010101", "accent": "#c69214" } },
            "PHI": { "name": "Philadelphia Flyers", "colors": { "primary": "#fa4616", "secondary": "#010101", "accent": "#ffffff" } },
            "PIT": { "name": "Pittsburgh Penguins", "colors": { "primary": "#010101", "secondary": "#ffb81c", "accent": "#ffffff" } },
            "SJS": { "name": "San Jose Sharks", "colors": { "primary": "#006272", "secondary": "#e57200", "accent": "#010101" } },
            "STL": { "name": "St Louis Blues", "colors": { "primary": "#003087", "secondary": "#ffb81c", "accent": "#041e42" } },
            "TBL": { "name": "Tampa Bay Lightning", "colors": { "primary": "#00205b", "secondary": "#ffffff", "accent": "#000000" } },
            "TOR": { "name": "Toronto Maple Leafs", "colors": { "primary": "#00205b", "secondary": "#ffffff", "accent": "#000000" } },
            "VAN": { "name": "Vancouver Canucks", "colors": { "primary": "#00205b", "secondary": "#041c2c", "accent": "#97999b" } },
            "VGK": { "name": "Vegas Golden Knights", "colors": { "primary": "#b4975a", "secondary": "#333f42", "accent": "#010101" } },
            "WSH": { "name": "Washington Capitals", "colors": { "primary": "#a6192e", "secondary": "#041e42", "accent": "#782f40" } },
            "WPG": { "name": "Winnipeg Jets", "colors": { "primary": "#041e42", "secondary": "#c8102e", "accent": "#ffffff" } },
            "UTA": { "name": "Utah Hockey Club", "colors": { "primary": "#010101", "secondary": "#862633", "accent": "#ddcba4" } },
            "SEA": { "name": "Seattle Kraken", "colors": { "primary": "#001628", "secondary": "#99d9d9", "accent": "#355464" } }
        };

        async function fetchData(endpoint) {
            try {
                const response = await fetch(`${API_BASE_URL}${endpoint}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error(`Error fetching ${endpoint}:`, error);
                throw error;
            }
        }

        async function fetchNextGame() {
            try {
                const response = await fetch(`${API_BASE_URL}/next-game`);
                if (!response.ok) {
                    if (response.status === 404) {
                        return null; // No upcoming game found
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error('Error fetching next game:', error);
                return null;
            }
        }

        async function loadData() {
            showLoading();
            hideError();

            try {
                // Fetch all data in parallel
                const [players, history] = await Promise.all([
                    fetchData('/players'),
                    fetchData('/cup-history')
                ]);

                playersData = players.players;
                cupHistory = history;

                // Get current owner from cup history (team with most recent cup day)
                findCurrentOwner();

                // Display the data
                displayCurrentHolder();
                displayLeaderboard();

                // Fetch and display next game (non-blocking)
                displayNextGame();

                hideLoading();
                updateLastUpdated();

            } catch (error) {
                hideLoading();
                showError('Failed to load cup data. Please check your connection and try again.');
            }
        }

        function findCurrentOwner() {
            let mostRecentDate = '';
            let mostRecentTeam = '';

            cupHistory.teams.forEach(team => {
                if (team.cup_days.length > 0) {
                    const lastDate = team.cup_days[team.cup_days.length - 1];
                    if (lastDate > mostRecentDate) {
                        mostRecentDate = lastDate;
                        mostRecentTeam = team.team;
                    }
                }
            });

            currentOwner = mostRecentTeam;
        }

        function displayCurrentHolder() {
            const currentHolderDiv = document.getElementById('currentHolder');
            const currentTeamDiv = document.getElementById('currentTeam');
            const currentPlayerDiv = document.getElementById('currentPlayer');

            if (currentOwner) {
                const player = findPlayerByTeam(currentOwner);
                const teamInfo = teamColors[currentOwner];

                if (teamInfo) {
                    // Update team name to full name
                    currentTeamDiv.textContent = teamInfo.name;

                    // Create dynamic background with team colors
                    const colors = teamInfo.colors;
                    const gradient = `linear-gradient(135deg, ${colors.primary} 0%, ${colors.secondary} 50%, ${colors.accent} 100%)`;
                    currentHolderDiv.style.background = gradient;

                    // Adjust text color based on background brightness
                    const textColor = getContrastColor(colors.primary);
                    currentHolderDiv.style.color = textColor;
                } else {
                    // Fallback for unknown teams
                    currentTeamDiv.textContent = currentOwner;
                    currentHolderDiv.style.background = 'linear-gradient(135deg, #0ea5e9 0%, #38bdf8 50%, #7dd3fc 100%)';
                    currentHolderDiv.style.color = 'white';
                }

                currentPlayerDiv.textContent = player ? `${player.name}'s team` : 'Unknown player';
                currentHolderDiv.style.display = 'block';
            } else {
                currentHolderDiv.style.display = 'none';
            }
        }

        function getContrastColor(hexColor) {
            // Remove # if present
            const hex = hexColor.replace('#', '');

            // Convert to RGB
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);

            // Calculate relative luminance
            const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;

            // Return white for dark backgrounds, dark for light backgrounds
            return luminance > 0.5 ? '#000000' : '#ffffff';
        }

        async function displayNextGame() {
            const nextGameDiv = document.getElementById('nextGame');
            const nextGameContentDiv = document.getElementById('nextGameContent');

            try {
                const nextGame = await fetchNextGame();

                if (nextGame) {
                    // Format the date in PST to match backend calculations
                    const dateParts = nextGame.date.split('-');
                    const gameDate = new Date(parseInt(dateParts[0]), parseInt(dateParts[1]) - 1, parseInt(dateParts[2]));
                    const formattedDate = gameDate.toLocaleDateString('en-US', {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        timeZone: 'America/Los_Angeles'
                    });

                    // Format the time in PST to match backend calculations
                    let gameTime = 'TBD';
                    if (nextGame.time !== 'TBD' && nextGame.time) {
                        try {
                            const timeDate = new Date(nextGame.time);
                            gameTime = timeDate.toLocaleTimeString('en-US', {
                                hour: 'numeric',
                                minute: '2-digit',
                                timeZone: 'America/Los_Angeles',
                                timeZoneName: 'short'
                            });
                        } catch (e) {
                            gameTime = nextGame.time;
                        }
                    }

                    // Create matchup display with players
                    const cupHolderDisplay = nextGame.cup_holder_player
                        ? `${currentOwner} (${nextGame.cup_holder_player})`
                        : currentOwner;
                    const opponentDisplay = nextGame.opponent_player
                        ? `${nextGame.opponent} (${nextGame.opponent_player})`
                        : nextGame.opponent;

                    const matchup = nextGame.is_home
                        ? `${cupHolderDisplay} vs ${opponentDisplay}`
                        : `${opponentDisplay} @ ${cupHolderDisplay}`;

                    nextGameContentDiv.innerHTML = `
                        <div class="vs-matchup">${matchup}</div>
                        <div class="game-details">
                            <div class="game-detail">
                                <div class="game-detail-label">Date</div>
                                <div class="game-detail-value">${formattedDate}</div>
                            </div>
                            <div class="game-detail">
                                <div class="game-detail-label">Time</div>
                                <div class="game-detail-value">${gameTime}</div>
                            </div>
                            <div class="game-detail">
                                <div class="game-detail-label">Venue</div>
                                <div class="game-detail-value">${nextGame.venue}</div>
                            </div>
                            <div class="game-detail">
                                <div class="game-detail-label">Location</div>
                                <div class="game-detail-value">${nextGame.is_home ? 'Home' : 'Away'}</div>
                            </div>
                        </div>
                    `;

                    nextGameDiv.style.display = 'block';
                } else {
                    nextGameContentDiv.innerHTML = `
                        <div class="no-game">No upcoming games found in the next 30 days</div>
                    `;
                    nextGameDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Error displaying next game:', error);
                nextGameDiv.style.display = 'none';
            }
        }

        function findPlayerByTeam(teamAbbrev) {
            return playersData.find(player =>
                player.teams.includes(teamAbbrev)
            );
        }

        function calculatePlayerStats(player) {
            let totalCupDays = 0;
            let teamsWithCup = [];

            player.teams.forEach(team => {
                const teamHistory = cupHistory.teams.find(t => t.team === team);
                if (teamHistory) {
                    totalCupDays += teamHistory.cup_days.length;
                    if (teamHistory.cup_days.length > 0) {
                        teamsWithCup.push(team);
                    }
                }
            });

            return {
                totalCupDays,
                teamsWithCup,
                hasCurrentCup: player.teams.includes(currentOwner)
            };
        }

        function displayLeaderboard() {
            const leaderboardDiv = document.getElementById('leaderboard');
            const playerListDiv = document.getElementById('playerList');

            // Calculate stats and sort players
            const playerStats = playersData.map(player => ({
                ...player,
                ...calculatePlayerStats(player)
            })).sort((a, b) => b.totalCupDays - a.totalCupDays);

            // Generate HTML for each player
            const playersHTML = playerStats.map((player, index) => `
                <div class="player-row">
                    <div class="player-rank">#${index + 1}</div>
                    <div class="player-info">
                        <div class="player-name">${player.name}</div>
                        <div class="player-teams">
                            ${player.teams.map(team => {
                                const teamInfo = teamColors[team];
                                const backgroundColor = teamInfo ? teamInfo.colors.primary : '#38bdf8';
                                const textColor = teamInfo ? getContrastColor(teamInfo.colors.primary) : '#ffffff';
                                const hasCurrentCup = team === currentOwner;

                                return `
                                    <span class="team-tag ${hasCurrentCup ? 'has-cup' : ''}"
                                          style="background-color: ${backgroundColor}; color: ${textColor};">
                                        ${team}
                                    </span>
                                `;
                            }).join('')}
                        </div>
                    </div>
                    <div class="player-stats">
                        <div class="cup-days">${player.totalCupDays}</div>
                        <div class="cup-days-label">cup days</div>
                    </div>
                </div>
            `).join('');

            playerListDiv.innerHTML = playersHTML;
            leaderboardDiv.style.display = 'block';

            // Display clinch status based on the sorted player stats
            displayClinchStatus(playerStats);
        }

        function displayClinchStatus(playerStats) {
            const clinchDiv = document.getElementById('clinchStatus');
            const clinchContent = document.getElementById('clinchContent');
            const daysLeft = getDaysLeftInSeason();

            if (playerStats.length < 2 || daysLeft <= 0) {
                clinchDiv.style.display = 'none';
                return;
            }

            const leader = playerStats[0];
            const secondPlace = playerStats[1];
            const leadMargin = leader.totalCupDays - secondPlace.totalCupDays;

            // Magic number: days left - lead margin + 1
            // When magic number reaches 0 or below, leader has clinched
            const magicNumber = daysLeft - leadMargin + 1;

            if (magicNumber <= 0) {
                // Leader has clinched!
                clinchDiv.classList.add('clinched');
                clinchContent.innerHTML = `
                    <div class="clinch-number">🎉 CLINCHED! 🎉</div>
                    <div class="clinch-details">
                        <strong>${leader.name}</strong> has won the In-Season Cup with ${leader.totalCupDays} cup days!<br>
                        ${secondPlace.name} cannot catch up with only ${daysLeft} day${daysLeft !== 1 ? 's' : ''} remaining.
                    </div>
                `;
            } else {
                clinchDiv.classList.remove('clinched');
                clinchContent.innerHTML = `
                    <div class="clinch-number">${magicNumber}</div>
                    <div class="clinch-details">
                        <strong>${leader.name}</strong> leads by ${leadMargin} day${leadMargin !== 1 ? 's' : ''} over ${secondPlace.name}<br>
                        Magic number to clinch: ${magicNumber} (combination of lead gains or days elapsed)
                    </div>
                `;
            }

            clinchDiv.style.display = 'block';
        }

        async function updateCup() {
            try {
                const response = await fetch(`${API_BASE_URL}/update`, {
                    method: 'POST'
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                console.log('Update result:', result);

            } catch (error) {
                console.error('Failed to update cup data:', error);
                throw error; // Re-throw to be handled by caller
            }
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        function updateLastUpdated() {
            const lastUpdatedDiv = document.getElementById('lastUpdated');
            const now = new Date();
            const pstTime = now.toLocaleString('en-US', {
                timeZone: 'America/Los_Angeles',
                timeZoneName: 'short'
            });
            lastUpdatedDiv.textContent = `Last updated: ${pstTime}`;
        }

        async function initializePage() {
            showLoading();
            try {
                // First update the cup data to ensure we have the latest information
                await updateCup();
                // Then load and display the data
                await loadData();
            } catch (error) {
                hideLoading();
                showError('Failed to initialize page. Please refresh and try again.');
            }
        }

        // Initialize page when it loads
        window.addEventListener('load', initializePage);

        // Auto-refresh every 30 minutes (reduced frequency since we update on load)
        setInterval(loadData, 30 * 60 * 1000);
    </script>
</body>

</html>
